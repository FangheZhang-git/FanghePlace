<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Results</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/results.css">
    <link rel="stylesheet" href="css/comments.css">
    <link rel="icon" href="image/ScholarMatch.png">

</head>

<body>
    <header class="header">
        <a href="index.html">
            <h1 class="templogo">ScholarMatch</h1>
        </a>
    </header>
    <main class="resultsSection">
        <h2>Matching Scholarship Programs</h2>
        <div id="scholarshipResults"></div>
    </main>

    <div id="commentsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="commentsTitle">
        <div class="modal-content" tabindex="-1">
            <div class="comments-modal-header">
                <div>
                    <p class="comments-eyebrow">ScholarMatch community</p>
                    <h2 id="commentsTitle">Student comments</h2>
                    <p id="commentsSummary" class="comments-summary">Read helpful notes from other students.</p>
                </div>
                <button type="button" class="close" data-close-comments aria-label="Close comments">&times;</button>
            </div>
            <div id="commentsContainer" aria-live="polite"></div>
            <div class="comment-input-area">
                <label for="commentInput">Share something helpful</label>
                <textarea id="commentInput" maxlength="1000" placeholder="Add application tips, deadline updates, or your experience..."></textarea>
                <div class="comment-composer-footer">
                    <span id="commentFeedback" class="comment-feedback" aria-live="polite">Be respectful and keep personal information private.</span>
                    <button type="button" data-submit-comment class="comment-btn">Post comment</button>
                </div>
            </div>
        </div>
    </div>

    <div id="google_translate_element" style="display:none;"></div>

    <script src="javascript/translate.js"></script>
    <script src="javascript/safeDom.js"></script>
    <script src="javascript/results.js"></script>
    <script src="javascript/heart.js"></script>
    <script src="javascript/comments.js"></script>
    <script src="javascript/checkToken.js"></script>
</body>

</html>
